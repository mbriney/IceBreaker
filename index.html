<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d4d47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Icebreaker">
<meta name="description" content="A party game for your phone with 6,000+ icebreaker questions. Play live with a join code, pass one phone around, or text a challenge.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Icebreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a game night — warm, quick, a little cheeky; the questions do the talking.
   IDEA: a card table. Teal felt ground, oversized playing cards dealt one at a time.
   PICTURE: the card itself, centered and big, colored by its category.
   COLOUR and TYPE: felt teal dominant, ivory cards, coral accent; Fraunces on cards, Outfit for everything else.
   LAYOUT: one phone column; header, the card or list, a thumb-reach action bar pinned to the bottom. */
:root{color-scheme:light dark;
  --felt:light-dark(#0f5a52,#0a2f2c);--felt2:light-dark(#0c4b45,#072421);
  --card:light-dark(#fffdf8,#1d2826);--ink:light-dark(#14211f,#eef4f2);--soft:light-dark(#5d6d6a,#9fb2ae);
  --on:#f2fbf9;--onsoft:#bfe0da;--line:light-dark(#e6e1d6,#2c3a37);--acc:#ff6b4a;--acc2:#ffb347}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--felt) 0%,var(--felt2) 100%) fixed;color:var(--on);
  font:16px/1.5 Outfit,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:clip}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),16px) 0 max(env(safe-area-inset-left),16px)}
header{display:flex;align-items:center;gap:10px;min-height:48px}
header h1{font:700 22px/1 Fraunces,Georgia,serif;margin:0;flex:1;letter-spacing:-.01em}
header .sub{color:var(--onsoft);font-size:14px}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:8px 0 20px}
.bar{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 max(env(safe-area-inset-bottom),14px);
  background:linear-gradient(transparent,var(--felt2) 30%);z-index:5}
button,.btn{font:600 17px/1 Outfit,system-ui,sans-serif;min-height:52px;border-radius:16px;border:0;padding:0 18px;cursor:pointer;
  background:var(--acc);color:#fff;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.ghost,.btn.ghost{background:rgba(255,255,255,.12);color:var(--on)}
button.small{min-height:44px;font-size:15px;flex:none;border-radius:12px}
button:disabled{opacity:.45;cursor:default}
button.icon{flex:none;width:44px;min-height:44px;padding:0;background:rgba(255,255,255,.12);border-radius:12px;font-size:22px}
input,textarea{font:16px/1.4 Outfit,system-ui,sans-serif;width:100%;border-radius:14px;border:2px solid transparent;padding:14px;
  background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;margin:0 0 6px}
.panel{background:rgba(0,0,0,.18);border-radius:20px;padding:16px}
.panel h2,.h2{font:600 19px/1.2 Fraunces,Georgia,serif;margin:0 0 10px}
.muted{color:var(--onsoft);font-size:15px}
.hero{padding:18px 4px 4px}
.hero .big{font:700 clamp(40px,13vw,56px)/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.02em}
.hero p{color:var(--onsoft);margin:10px 0 0;max-width:34ch}
.fan{position:relative;height:190px;margin:8px 0 0}
.fan i{position:absolute;left:50%;top:14px;width:116px;height:160px;border-radius:14px;background:var(--card);
  box-shadow:0 10px 24px rgba(0,0,0,.28);transform-origin:50% 120%}
.fan i::before{content:"";position:absolute;inset:0 0 auto;height:44px;border-radius:14px 14px 0 0;background:var(--c)}
.fan i::after{content:"?";position:absolute;inset:44px 0 0;display:grid;place-items:center;font:700 54px Fraunces,serif;color:var(--c)}
.menu{display:grid;gap:12px}
.menu button{justify-content:flex-start;text-align:left;padding:14px 16px;min-height:76px;flex-direction:column;align-items:flex-start;gap:4px;
  background:var(--card);color:var(--ink)}
.menu button b{font-size:18px}.menu button span{font-weight:400;font-size:14px;color:var(--soft);line-height:1.3}
.menu button.lead{background:var(--acc);color:#fff}.menu button.lead span{color:#ffe7e0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;font-size:15px;border-radius:12px;background:rgba(255,255,255,.1);color:var(--on);padding:0 12px}
.seg button[aria-pressed=true]{background:var(--on);color:#0c4b45}
.row{display:flex;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.switch input{width:52px;height:30px;appearance:none;background:rgba(255,255,255,.2);border-radius:20px;position:relative;flex:none;padding:0;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--acc)}.switch input:checked::after{left:25px}
.players{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.players li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 8px 8px 12px;min-height:52px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c)}
.players li .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:13px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.tag.ok{background:#2fb67c;color:#fff}.tag.off{background:rgba(0,0,0,.25);color:var(--onsoft)}
.code{font:700 clamp(48px,16vw,72px)/1 Fraunces,Georgia,serif;letter-spacing:.12em;text-align:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{min-height:96px;border-radius:16px;background:var(--c);color:#fff;text-align:left;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  padding:12px;gap:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cat b{font-size:17px;line-height:1.15}.cat span{font-weight:400;font-size:13px;opacity:.9;line-height:1.25}
.cat.surprise{background:repeating-linear-gradient(135deg,#ff6b4a 0 18px,#ffb347 18px 36px)}
.cat[aria-pressed=true]{outline:3px solid #fff;outline-offset:2px}
.sect{font-weight:600;color:var(--onsoft);margin:6px 2px 0;font-size:14px}
.card{position:relative;background:var(--card);color:var(--ink);border-radius:24px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.32),0 2px 0 rgba(255,255,255,.6) inset;min-height:min(56dvh,440px);display:flex;flex-direction:column}
.card .top{background:var(--c);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
.card .top small{font-weight:500;opacity:.9}
.card .q{flex:1;display:flex;align-items:center;padding:24px 22px;font:600 clamp(24px,7vw,32px)/1.2 Fraunces,Georgia,serif;text-wrap:balance}
.card .foot{padding:0 18px 16px;color:var(--soft);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.card .corner{position:absolute;right:18px;bottom:44px;font:700 64px/1 Fraunces,serif;color:var(--c);opacity:.12;pointer-events:none}
.deal{animation:deal .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes deal{from{transform:translateY(40px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.deal{animation:none}.switch input::after{transition:none}}
.answers{display:grid;gap:10px}
.ans{background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;border-left:6px solid var(--c)}
.ans b{display:block;font-size:14px;color:var(--soft);margin-bottom:2px}
.ans p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.locked{filter:blur(7px);user-select:none}
.notice{background:rgba(0,0,0,.28);border-radius:14px;padding:12px 14px;color:var(--onsoft);font-size:15px}
.notice.warn{background:#7a2b18;color:#ffe4dc}
.center{text-align:center}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-size:15px}
.list li b{display:block;font-size:13px;color:var(--onsoft);font-weight:600}
.err{color:#ffd1c4;font-size:15px;min-height:1.4em}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
</style>
</head>
<body>
<div id="app"><main><p class="muted">Loading questions…</p></main></div>
<script src="questions.js"></script>
<script src="peerjs.min.js" defer></script>
<script>
{
const D = window.ICEBREAKER;
const CAT = Object.fromEntries(D.cats.map(c => [c.id, c]));
const TOTAL = D.cats.reduce((n, c) => n + c.count, 0);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Names, players, answers and settings live in memory only and are gone when the tab closes.
// The one thing cached on the device is which questions you've already seen (question numbers only),
// so cards don't repeat across visits.
const mem = {};
const store = { get: (k, d) => (k in mem ? mem[k] : d), set: (k, v) => { mem[k] = v; } };
const seen = {
  load() { try { return JSON.parse(localStorage.getItem('ib-seen') || '[]'); } catch (e) { return []; } },
  save(a) { try { localStorage.setItem('ib-seen', JSON.stringify(a.slice(-5000))); } catch (e) {} }
};
const COLORS = ['#ff7a59','#7c5cff','#00b3b3','#e8a317','#2a8bdc','#f25c94','#30a46c','#e5484d','#9b51e0','#4c6ef5','#f76b15','#d6409f','#12a594','#ad7f58','#8e4ec6','#3e63dd'];
const REDRAWS = 2;
const PEER_OPTS = window.IB_PEER || { debug: 0 };
const rid = () => Math.random().toString(36).slice(2, 10);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const ME = rid() + rid();
let myName = store.get('name', '');
let prefs = Object.assign({ deal: 'mix', answers: 'talk', adult: false, per: 1 }, store.get('prefs', {}));
const cats = adult => D.cats.filter(c => adult || !c.adult);

/* ---------- deck: no repeats on this device until a category runs out ---------- */
const used = new Set(seen.load());
const groupSeen = new Set();   // live games: cards any player in the room has already seen
const markSeen = k => { if (k && !used.has(k)) { used.add(k); seen.save([...used]); } };
function draw(cat) {
  const qs = D.q[cat];
  const fresh = i => !used.has(cat + ':' + i) && !groupSeen.has(cat + ':' + i);
  let pool = qs.map((_, i) => i).filter(fresh);
  if (!pool.length) {                       // the group has seen every card here: start this category over
    for (const k of [...used]) if (k.startsWith(cat + ':')) used.delete(k);
    for (const k of [...groupSeen]) if (k.startsWith(cat + ':')) groupSeen.delete(k);
    pool = qs.map((_, i) => i);
  }
  const i = pickOne(pool), key = cat + ':' + i;
  markSeen(key); groupSeen.add(key);
  return { cat, text: qs[i], key };
}

/* ---------- game engine (runs on the host phone, or locally for one-phone play) ---------- */
function newGame(host, settings) {
  return { phase: 'lobby', host, settings: { ...settings }, players: [], picks: {}, queue: [], turn: 0, answers: {}, revealed: false, round: 0 };
}
const active = g => g.players.filter(p => p.on);
const curCard = g => g.queue[g.turn];
function startRound(g) { g.round++; g.picks = {}; g.queue = []; g.turn = 0; g.answers = {}; g.revealed = false; g.phase = 'pick'; }
function deal(g) {
  const ps = active(g), pool = cats(g.settings.adult).map(c => c.id);
  const picks = ps.map(p => g.picks[p.id] || pickOne(pool));
  const n = ps.length, mode = g.settings.deal;
  const first = mode === 'own' ? picks : mode === 'next' ? ps.map((_, i) => picks[(i - 1 + n) % n]) : shuffle([...picks]);
  g.queue = [];
  for (let r = 0; r < g.settings.per; r++)
    ps.forEach((p, i) => g.queue.push({ owner: p.id, by: mode === 'next' ? ps[(i - 1 + n) % n].id : null, redraws: 0, ...draw(r === 0 ? first[i] : pickOne(picks)) }));
  g.turn = 0; g.answers = {}; g.revealed = false; g.phase = 'play';
}
function act(g, id, a) {
  const isHost = id === g.host, card = curCard(g), owner = card && card.owner === id;
  switch (a.t) {
    case 'join': {
      const name = String(a.name || 'Player').trim().slice(0, 20) || 'Player';
      const p = g.players.find(p => p.id === id);
      if (p) { p.name = name; p.on = true; return true; }
      if (g.players.length >= 16) return false;
      const taken = new Set(g.players.map(p => p.color));
      g.players.push({ id, name, color: COLORS.find(c => !taken.has(c)) || pickOne(COLORS), on: true });
      if (g.phase === 'play' && g.settings.answers === 'type') {} // joins mid-round; answers on next card
      return true;
    }
    case 'leave': { const p = g.players.find(p => p.id === id); if (p) p.on = false; checkProgress(g); return true; }
    case 'kick': if (!isHost) return false; g.players = g.players.filter(p => p.id !== a.id); delete g.picks[a.id]; checkProgress(g); return true;
    case 'settings': if (!isHost || g.phase !== 'lobby') return false; Object.assign(g.settings, a.s); return true;
    case 'start': case 'round': if (!isHost || active(g).length < 2) return false; startRound(g); return true;
    case 'lobby': if (!isHost) return false; g.phase = 'lobby'; return true;
    case 'pick':
      if (g.phase !== 'pick' || !cats(g.settings.adult).some(c => c.id === a.cat)) return false;
      g.picks[id] = a.cat; checkProgress(g); return true;
    case 'forceDeal': if (!isHost || g.phase !== 'pick') return false; deal(g); return true;
    case 'answer':
      if (g.phase !== 'play' || g.revealed) return false;
      g.answers[id] = String(a.text || '').trim().slice(0, 600) || '(passed)'; checkProgress(g); return true;
    case 'reveal': if (!(isHost || owner) || g.phase !== 'play') return false; g.revealed = true; return true;
    case 'redraw':
      if (!(isHost || owner) || g.phase !== 'play' || !card || card.redraws >= REDRAWS || g.revealed) return false;
      Object.assign(card, draw(card.cat), { redraws: card.redraws + 1 }); g.answers = {}; return true;
    case 'next':
      if (!(isHost || owner) || g.phase !== 'play') return false;
      g.turn++; g.answers = {}; g.revealed = false;
      if (g.turn >= g.queue.length) g.phase = 'end';
      return true;
  }
  return false;
}
function checkProgress(g) {
  const ps = active(g);
  if (g.phase === 'pick' && ps.length && ps.every(p => g.picks[p.id])) deal(g);
  if (g.phase === 'play' && g.settings.answers === 'type' && !g.revealed && ps.length && ps.every(p => g.answers[p.id] != null)) g.revealed = true;
}
function publicState(g) {
  return { ...g, answered: Object.keys(g.answers), answers: g.revealed ? g.answers : {}, picks: Object.fromEntries(Object.keys(g.picks).map(k => [k, true])) };
}

/* ---------- session ---------- */
let view = 'home', mode = null, G = null, peer = null, conns = new Map(), conn = null, code = '', status = '', err = '', wake = null, chOut = null, chIn = null, lastCardKey = '';
const go = v => { view = v; err = ''; render(); window.scrollTo(0, 0); };
const isHostView = () => mode === 'local' || mode === 'host';
const meId = () => mode === 'local' ? null : ME;

function send(a, as = ME) {
  if (mode === 'client') { if (conn && conn.open) conn.send(a); else { status = 'Reconnecting…'; render(); } return; }
  if (act(G, as, a)) { broadcast(); render(); }
}
function broadcast() {
  if (mode !== 'host') return;
  const s = publicState(G);
  for (const c of conns.values()) if (c.open) c.send({ t: 'state', s });
}
const peerId = c => 'icebreaker-mb-' + c;
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const newCode = () => Array.from({ length: 4 }, () => pickOne(CODE_CHARS)).join('');

async function keepAwake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (mode === 'host' || mode === 'client')) { keepAwake(); if (mode === 'client' && (!conn || !conn.open)) joinGame(code); } });

function needPeer() {
  if (!window.Peer) { err = 'Live play needs an internet connection. Try again in a moment.'; render(); return false; }
  return true;
}
function hostGame() {
  if (!needPeer()) return;
  mode = 'host'; code = newCode(); groupSeen.clear(); G = newGame(ME, prefs); act(G, ME, { t: 'join', name: myName });
  status = 'Opening room…'; go('game');
  peer && peer.destroy();
  peer = new Peer(peerId(code), PEER_OPTS);
  peer.on('open', () => { status = ''; keepAwake(); render(); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { code = newCode(); peer.destroy(); hostGame(); return; }
    if (e.type === 'peer-unavailable') return;
    status = 'Connection trouble: ' + (e.type || 'network') + '. Players may need to rejoin.'; render();
  });
  peer.on('disconnected', () => { status = 'Reconnecting room…'; render(); try { peer.reconnect(); } catch (e) {} });
  peer.on('connection', c => {
    let pid = null;
    c.on('data', a => {
      if (!a || typeof a !== 'object') return;
      if (a.t === 'join') {
        pid = String(a.id || '').slice(0, 20); if (!pid) return; conns.set(pid, c);
        if (Array.isArray(a.seen)) for (const k of a.seen.slice(-5000)) if (typeof k === 'string' && /^[a-z]+:\d+$/.test(k)) groupSeen.add(k);
      }
      if (!pid) return;
      if (act(G, pid, a)) { broadcast(); render(); } else if (a.t === 'join') c.send({ t: 'state', s: publicState(G) });
    });
    c.on('close', () => { if (pid && conns.get(pid) === c) { conns.delete(pid); act(G, pid, { t: 'leave' }); broadcast(); render(); } });
  });
}
function joinGame(c) {
  if (!needPeer()) return;
  c = String(c || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (c.length !== 4) { err = 'Codes are 4 letters.'; render(); return; }
  if (!myName.trim()) { err = 'Add your name first.'; render(); return; }
  mode = 'client'; code = c; status = 'Connecting to ' + c + '…'; if (view !== 'game') go('game'); else render();
  if (!peer || peer.destroyed) {
    peer = new Peer(PEER_OPTS);
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') { mode = null; G = null; view = 'join'; err = 'No game found with code ' + code + '. Check the code, or ask the host to keep their screen on.'; render(); return; }
      status = 'Connection trouble (' + (e.type || 'network') + '). Tap Rejoin.'; render();
    });
    peer.on('open', () => connect());
  } else connect();
}
function connect() {
  conn = peer.connect(peerId(code), { reliable: true });
  conn.on('open', () => { status = ''; conn.send({ t: 'join', id: ME, name: myName, seen: [...used] }); keepAwake(); render(); });
  conn.on('data', m => { if (m && m.t === 'state') { G = m.s; status = ''; if (G.phase === 'play') { const c = curCard(G); if (c) markSeen(c.key); } render(); } });
  conn.on('close', () => { if (mode === 'client') { status = 'Lost connection to the host.'; render(); } });
}
function leaveGame() {
  if (mode === 'client' && conn && conn.open) conn.send({ t: 'leave' });
  try { peer && peer.destroy(); } catch (e) {}
  peer = null; conn = null; conns.clear(); groupSeen.clear(); mode = null; G = null; status = ''; try { wake && wake.release(); } catch (e) {}
  history.replaceState(null, '', location.pathname); go('home');
}
function startLocal() {
  mode = 'local'; G = newGame('local', { ...prefs, answers: 'talk' });
  for (const n of store.get('localPlayers', [])) act(G, rid(), { t: 'join', name: n });
  go('game');
}

/* ---------- text-a-challenge links ---------- */
/* Challenge links are encrypted with AES-GCM. The ciphertext rides in the query string (?ch=);
   the key rides in the fragment (#k=), which browsers never send to any server. */
const toB64 = u8 => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function seal(obj) {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));

  shareCh: () => share(chOut.msg, chOut.url),
  chReveal: () => {
    if (!myName.trim()) { err = 'Add your name.'; render(); return; }
    if (!chIn.mine.trim()) { err = 'Type your answer to unlock theirs.'; render(); return; }
    chIn.done = true; render();
  },
  chBack: () => {
    const thread = [...(chIn.t || []), { c: chIn.c, q: chIn.q, f: chIn.f, a: chIn.a, n: myName.trim(), r: chIn.mine.trim() }].slice(-6);
    history.replaceState(null, '', location.pathname);
    chOut = null; newChallenge(thread, chIn.f);
  },
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && H[b.dataset.act] && b.tagName !== 'INPUT') { e.preventDefault(); H[b.dataset.act](b.dataset, b); return; }
  const li = e.target.closest('.players li');
  if (li && mode === 'local' && G && G.phase === 'lobby') {
    const i = [...li.parentNode.children].indexOf(li); G.players.splice(i, 1); store.set('localPlayers', G.players.map(p => p.name)); render();
  }
});
window.addEventListener('beforeunload', () => { if (mode === 'client' && conn && conn.open) conn.send({ t: 'leave' }); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!readHash()) render();
}
</script>
</body>
</html>
